<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bintang's AU Phone</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif; user-select: none; }
    body { background-color: #0d1117; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #fff; overflow: hidden; }

    /* PHONE CONTAINER */
    .phone { width: 375px; height: 750px; background: #1c1c1e; border-radius: 48px; padding: 12px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); border: 4px solid #2c2c2e; position: relative; }
    .screen { width: 100%; height: 100%; border-radius: 38px; overflow: hidden; position: relative; background: #000; }

    /* STATUS BAR */
    .status-bar { padding: 12px 22px 0 22px; height: 44px; display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; z-index: 100; position: absolute; width: 100%; top: 0; left: 0; color: #fff; }

    /* COMMON SCREEN STYLES */
    .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; transition: all 0.3s ease-in-out; }
    .layer.active { display: flex; }

    /* 1. LOCKSCREEN */
    #lock-screen { background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000'); background-size: cover; background-position: center; justify-content: space-between; padding: 60px 20px 40px 20px; z-index: 80; }
    .lock-clock { text-align: center; margin-top: 20px; }
    .lock-time { font-size: 64px; font-weight: 200; letter-spacing: -2px; }
    .lock-date { font-size: 16px; font-weight: 500; opacity: 0.9; }
    .swipe-hint { text-align: center; font-size: 13px; opacity: 0.8; animation: bounce 1.5s infinite; cursor: pointer; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    /* 2. PASSCODE SCREEN */
    #passcode-screen { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); justify-content: center; align-items: center; z-index: 85; gap: 24px; }
    .passcode-title { font-size: 16px; font-weight: 500; }
    .dots-container { display: flex; gap: 16px; margin-bottom: 10px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; transition: background 0.2s; }
    .dot.filled { background: #fff; }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 24px; text-align: center; }
    .key-btn { width: 65px; height: 65px; border-radius: 50%; background: rgba(255, 255, 255, 0.15); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 500; cursor: pointer; transition: background 0.1s; }
    .key-btn:active { background: rgba(255, 255, 255, 0.4); }

    /* 3. HOMESCREEN */
    #home-screen { background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000'); background-size: cover; background-position: center; padding: 50px 16px 16px 16px; justify-content: space-between; z-index: 10; }
    .widgets-container { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .widget-box { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px); border-radius: 22px; padding: 14px; height: 135px; color: #000; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .widget-weather { background: #4a90e2; color: white; display: flex; flex-direction: column; justify-content: space-between; }
    .widget-calendar { background: #fff; display: flex; flex-direction: column; justify-content: space-between; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 8px; font-weight: 600; gap: 2px; }
    .cal-today { background: #ff3b30; color: white; border-radius: 50%; width: 12px; height: 12px; display: inline-flex; align-items: center; justify-content: center; }

    .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 16px; }
    .app-icon { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
    .icon-box { width: 56px; height: 56px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    .app-name { font-size: 11px; font-weight: 500; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }

    .dock { background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(20px); border-radius: 28px; padding: 10px 12px; display: flex; justify-content: space-around; margin-bottom: 6px; }

    /* APPS PAGE STYLES */
    .app-page { z-index: 50; background: #000; padding-top: 44px; padding-bottom: 20px; animation: slideUp 0.2s cubic-bezier(0,1,0.5,1); }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    /* MESSAGES APP */
    .app-header { height: 44px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 0.5px solid #2c2c2e; background: #000; }
    .back-btn { color: #0a84ff; font-size: 15px; background: none; border: none; cursor: pointer; }
    .chat-list { flex: 1; overflow-y: auto; }
    .chat-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 0.5px solid #1c1c1e; cursor: pointer; }
    .chat-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }
    .chat-info { flex: 1; }
    .chat-name { font-weight: 600; font-size: 15px; }
    .chat-preview { color: #8e8e93; font-size: 13px; }

    /* CHAT DETAIL */
    .chat-detail-body { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #000; }
    .bubble { max-width: 75%; padding: 10px 14px; border-radius: 18px; font-size: 13px; line-height: 1.4; word-wrap: break-word; }
    .bubble.in { background: #26262a; color: white; align-self: flex-start; border-bottom-left-radius: 4px; }
    .bubble.out { background: #0a84ff; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }

    /* MUSIC APP */
    .music-body { flex: 1; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: space-around; background: linear-gradient(180deg, #3a1c40, #000); text-align: center; }
    .album-art { width: 180px; height: 180px; border-radius: 50%; border: 6px solid #2c2c2e; box-shadow: 0 10px 30px rgba(0,0,0,0.8); object-fit: cover; animation: spin 10s linear infinite; animation-play-state: paused; }
    .album-art.playing { animation-play-state: running; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .play-btn { width: 60px; height: 60px; border-radius: 50%; background: #fa2d48; border: none; color: white; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    /* NOTES APP */
    .notes-list { flex: 1; padding: 16px; overflow-y: auto; }
    .note-card { background: #1c1c1e; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .note-title { font-weight: 700; font-size: 16px; margin-bottom: 4px; color: #ffcc00; }
    .note-desc { color: #d1d1d6; font-size: 13px; line-height: 1.5; }

    /* PHOTOS APP */
    .photos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; overflow-y: auto; flex: 1; }
    .photo-thumb { aspect-ratio: 1; object-fit: cover; width: 100%; cursor: pointer; }

    /* HOME INDICATOR BAR */
    .home-indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 120px; height: 5px; background: #fff; border-radius: 3px; z-index: 200; cursor: pointer; opacity: 0.8; }
    
    /* SHAKE ANIMATION IF PIN WRONG */
    .shake { animation: shake 0.3s ease-in-out; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
  </style>
</head>
<body>

<div class="phone">
  <div class="screen">
    
    <!-- STATUS BAR -->
    <div class="status-bar">
      <span id="current-time">21:36</span>
      <span>5G 67% <i class="fa-solid fa-battery-full"></i></span>
    </div>

    <!-- 1. LOCKSCREEN -->
    <div id="lock-screen" class="layer active" onclick="showPasscode()">
      <div class="lock-clock">
        <div class="lock-time" id="lock-time-text">21:36</div>
        <div class="lock-date">Kamis, 23 Oktober</div>
      </div>
      <div class="swipe-hint">
        <i class="fa-solid fa-chevron-up"></i>
        <p style="margin-top: 4px;">Geser atau klik untuk membuka</p>
      </div>
    </div>

    <!-- 2. PASSCODE SCREEN -->
    <div id="passcode-screen" class="layer">
      <div class="passcode-title">Masukkan PIN (Default: 1234)</div>
      <div class="dots-container" id="dots-container">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
      <div class="keypad">
        <div class="key-btn" onclick="pressKey('1')">1</div>
        <div class="key-btn" onclick="pressKey('2')">
